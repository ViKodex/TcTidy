# Configuration for the cargo-about JSON consumed by the exact runtime evidence
# generator. Regenerate the Windows VSIX inputs locally with:
#
#     cargo xtask licenses generate
#
# The accepted list is a hard allow-list: if a dependency carries a license that
# is not below, `cargo about` fails. That is intentional: it forces a human to
# review any new (and possibly non-permissive) license before a release ships.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Only the platforms that release binaries are published for (see release.yml).
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]

# Notices only need to cover what ends up in the shipped binary: build-time and
# test-only dependencies are not distributed, so leave them out.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# TcTidy's own workspace crates are MIT OR Apache-2.0 (the workspace license) and are
# not third parties, so they get no notice of their own: `ignore` skips every
# crate marked `publish = false`, which the workspace sets for all of them.
private = { ignore = true }
