name: Set up cargo-about
description: Install the pinned official license tool binary without compiling it.

runs:
  using: composite
  steps:
    - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2
      with:
        tool: cargo-about@0.9.1
        checksum: true
        fallback: none
