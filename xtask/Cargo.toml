[package]
name = "xtask"
description = "TcTidy development and release tooling. Not published."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
semver = "1"
clap.workspace = true
regex = "1"
roxmltree = "0.21"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
unicode-casefold = "0.2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
tctidy.workspace = true
tctidy-syntax.workspace = true
tctidy-twincat.workspace = true
