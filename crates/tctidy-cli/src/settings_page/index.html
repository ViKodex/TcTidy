<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Formatting settings - TcTidy</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<header class="appbar">
  <div class="appbar-title">
    <svg class="appbar-icon" viewBox="0 0 128 136" width="18" height="19" aria-hidden="true" focusable="false"><defs><mask id="appbar-icon-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="136"><rect width="128" height="136" fill="#fff"/><g fill="none" stroke="#000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M27 59.18Q20.5 55.93 20.5 61.53L20.5 70.33Q20.5 75.93 17 74.18Q20.5 75.93 20.5 81.53L20.5 90.33Q20.5 95.93 27 99.18"/><path d="M42 66.68Q48.5 69.93 48.5 75.53L48.5 84.33Q48.5 89.93 52 91.68Q48.5 89.93 48.5 95.53L48.5 104.33Q48.5 109.93 42 106.68"/><line x1="77.5" y1="76.93" x2="105.5" y2="62.93"/><line x1="77.5" y1="104.93" x2="93.5" y2="96.93"/></g></mask></defs><g class="ink" mask="url(#appbar-icon-cut)" stroke-width="6" stroke-linejoin="round"><polygon points="64,11.35 109.94,34.32 64,57.29 18.06,34.32"/><polygon points="11,44.21 58,67.71 58,121.65 11,98.15"/><polygon points="70,67.71 117,44.21 117,98.15 70,121.65"/></g><g class="accent" fill="none" stroke-width="7" stroke-linecap="round"><line x1="85.5" y1="86.93" x2="109.5" y2="74.93"/></g></svg>
    <span class="appbar-product">TcTidy</span>
    <span class="appbar-sep" aria-hidden="true">/</span>
    <h1>Formatting settings</h1>
  </div>
  <div class="appbar-file">
    <span id="file" class="file-path" dir="rtl">Loading…</span>
    <span id="file-tag" class="file-tag" hidden>New file</span>
  </div>
  <div class="appbar-actions">
    <div class="theme" role="group" aria-label="Theme">
      <button id="theme-light" class="theme-btn" type="button" aria-pressed="false" title="Light theme" aria-label="Light theme">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="2.75" fill="none" stroke="currentColor" stroke-width="1.25"/><path d="M8 1.5v1.25M8 13.25v1.25M1.5 8h1.25M13.25 8h1.25M3.4 3.4l.9.9M11.7 11.7l.9.9M3.4 12.6l.9-.9M11.7 4.3l.9-.9" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
      </button>
      <button id="theme-dark" class="theme-btn" type="button" aria-pressed="false" title="Dark theme" aria-label="Dark theme">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M13.25 9.75A5.5 5.5 0 0 1 6.25 2.75a5.5 5.5 0 1 0 7 7z" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <button id="discard" class="btn" type="button" disabled>Discard</button>
    <button id="save" class="btn btn-primary" type="button" disabled title="Save (Ctrl+S)">Save</button>
  </div>
</header>

<div id="banners" class="banners"></div>

<div class="workspace">
  <nav class="nav" aria-label="Setting groups">
    <ul id="nav" class="nav-list"></ul>
  </nav>

  <main id="settings" class="settings">
    <div class="toolbar">
      <div class="search">
        <input id="search" class="input" type="search" placeholder="Search settings" aria-label="Search settings" autocomplete="off" spellcheck="false">
      </div>
      <label class="check"><input id="only-changed" type="checkbox"> Modified only</label>
    </div>
    <div id="groups"></div>
    <p id="no-match" class="empty" hidden></p>
    <p id="footer" class="footnote"></p>
  </main>

  <aside class="inspector" aria-label="Preview">
    <div class="inspector-bar">
      <h2 id="pv-title"></h2>
      <code id="pv-key" class="key"></code>
      <span id="pv-meta" class="inspector-meta"></span>
    </div>

    <section class="preview">
      <div class="sample" aria-labelledby="pv-title">
        <div id="pv-blocks" class="sample-blocks"></div>
      </div>
      <div class="code-bar">
        <h2>Your code</h2>
        <p class="code-bar-note">Edit it or paste yours over it; nothing here is saved.</p>
        <button id="restore" class="btn btn-small" type="button" disabled title="Put the example function block back">Restore example</button>
      </div>
      <div id="row-decl" class="preview-row">
        <figure class="code-block">
          <figcaption class="code-head"><span class="code-role">Declaration</span><span class="code-value">input</span></figcaption>
          <div class="editor">
            <div class="editor-gutter" aria-hidden="true"><div id="decl-numbers"></div></div>
            <textarea id="decl-input" class="editor-input" wrap="off" spellcheck="false" placeholder="Paste a declaration: a POU's first line and its VAR blocks" aria-label="Declaration"></textarea>
          </div>
        </figure>
        <figure class="code-block">
          <figcaption class="code-head"><span class="code-role">Declaration</span><span class="code-value">formatted</span><span id="decl-note" class="code-aside"></span></figcaption>
          <div class="code" tabindex="0" role="region" aria-label="Formatted declaration"><div id="decl-output" class="code-lines"></div></div>
        </figure>
      </div>
      <div id="row-impl" class="preview-row">
        <figure class="code-block">
          <figcaption class="code-head"><span class="code-role">Implementation</span><span class="code-value">input</span></figcaption>
          <div class="editor">
            <div class="editor-gutter" aria-hidden="true"><div id="impl-numbers"></div></div>
            <textarea id="impl-input" class="editor-input" wrap="off" spellcheck="false" placeholder="Paste the code of a POU, a method or an action" aria-label="Implementation"></textarea>
          </div>
        </figure>
        <figure class="code-block">
          <figcaption class="code-head"><span class="code-role">Implementation</span><span class="code-value">formatted</span><span id="impl-note" class="code-aside"></span></figcaption>
          <div class="code" tabindex="0" role="region" aria-label="Formatted implementation"><div id="impl-output" class="code-lines"></div></div>
        </figure>
      </div>
    </section>
  </aside>
</div>
<noscript><p class="noscript">This page needs JavaScript.</p></noscript>
</body>
</html>
