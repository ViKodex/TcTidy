name: Perf

# Informational performance check: NEVER a PR gate. Run it manually when a local
# result needs a hosted-runner comparison. Real measurements still come from a
# quiet local machine against a corpus (see BENCHMARKS.md).
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The committed synthetic panel only: this workflow does not fetch a corpus.
  BENCH_ARGS: --warm-up-time 0.5 --measurement-time 2 --sample-size 10

jobs:
  bench:
    name: bench (directional, non-gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Catches a broken bench (a bad feature, a renamed symbol) without running it.
      - name: Compile-gate the benchmarks
        run: cargo bench -p tctidy --no-run --locked

      # Pin to one core and a single thread to take some noise off the hosted runner.
      - name: Benchmark the selected revision
        run: taskset -c 0 cargo bench -p tctidy --bench pipeline -- ${BENCH_ARGS}
        env:
          RAYON_NUM_THREADS: '1'

  extension-bench:
    name: extension spawn cost (directional, non-gating)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build tctidy (release, the binary the benchmarks spawn)
        run: cargo build -p tctidy-cli --release --locked
      # Measures spawning tctidy per file vs once for the batch. The per-file to
      # batch ratio is the signal; hosted-runner ms are noisy, so nothing gates.
      - name: Run the spawn-cost benchmarks
        env:
          TCTIDY_BIN: ${{ github.workspace }}/target/release/tctidy
        run: >-
          dotnet run -c Release
          --project editors/vs/TcTidy.VsExtension.Core.Benchmarks/TcTidy.VsExtension.Core.Benchmarks.csproj
          -- --filter '*'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: core-benchmarks-results
          path: '**/BenchmarkDotNet.Artifacts/results/*'
          if-no-files-found: warn
