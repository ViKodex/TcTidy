name: CI

# Builds and tests every pull request and every push to main. The `CI` job at
# the end is the one required check for merging.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify release metadata
        run: cargo xtask release check
      - name: Verify generated keyword sources
        run: cargo run -p xtask --locked -- keywords --check
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build all targets
        run: cargo build --workspace --all-targets --locked
      - name: Test workspace
        # The corpus tests skip here (no corpus); the Corpus job runs them.
        run: cargo test --workspace --locked
      - uses: ./.github/actions/vsix-integration
        with:
          setup-rust: 'false'
      # Fails if a dependency carries a license outside about.toml's allow-list,
      # so the pull request that adds it fails instead of the release.
      - uses: ./.github/actions/setup-cargo-about
      - name: Verify dependency licenses
        run: cargo xtask licenses generate

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Windows release helpers
        shell: pwsh
        run: ./scripts/release/tests/test-assert-version-text.ps1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build all targets
        run: cargo build --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - uses: ./.github/actions/vsix-integration
        with:
          setup-rust: 'false'
      - uses: ./.github/actions/setup-cargo-about
      - name: Generate exact Cargo evidence for the distributed binary
        run: cargo xtask licenses generate
      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Read the product version
        id: product-version
        shell: pwsh
        run: echo "version=$(cargo xtask release version)" >> $env:GITHUB_OUTPUT
      - name: Build and validate both XAE payloads
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version }}
        run: |
          & ./scripts/release/build-vsix.ps1 `
            -ProductVersion $env:PRODUCT_VERSION `
            -Payload15Directory installer-payload-xae15 `
            -Payload17Directory installer-payload-xae17
      # Inno Setup 6 is preinstalled on the Windows runner image.
      - name: Test installer discovery, security, upgrade and uninstall
        shell: pwsh
        run: |
          & ./scripts/release/test-installer.ps1 `
            -Payload15Directory installer-payload-xae15 `
            -Payload17Directory installer-payload-xae17
      # A build to try by hand in TcXaeShell. These steps come last, so that only a build
      # that passed every check above gets published.
      - name: Build the test installer
        id: test-installer
        shell: pwsh
        env:
          PRODUCT_VERSION: ${{ steps.product-version.outputs.version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # On a pull request github.sha is a merge commit that the pull request does not list.
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $channel = if ($env:PR_NUMBER) { "pr$env:PR_NUMBER" } else { 'main' }
          $version = "$env:PRODUCT_VERSION-$channel-$($env:COMMIT.Substring(0, 7))"
          $numeric = ($env:PRODUCT_VERSION -split '-')[0] + '.0'
          $payload15 = (Resolve-Path -LiteralPath installer-payload-xae15).Path
          $payload17 = (Resolve-Path -LiteralPath installer-payload-xae17).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" "/DNumericVersion=$numeric" `
            "/DPayload15Dir=$payload15" "/DPayload17Dir=$payload17" `
            editors/vs/installer/TcTidy.iss
          if ($LASTEXITCODE -ne 0) { throw 'test installer build failed' }
          "file=TcTidySetup-$version.exe" >> $env:GITHUB_OUTPUT
      - name: Upload the test installer
        id: upload-test-installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # With archive: false the artifact takes the file's name, but overwrite deletes by
          # this input. They must match for a re-run to replace its earlier upload.
          name: ${{ steps.test-installer.outputs.file }}
          path: editors/vs/installer/dist/${{ steps.test-installer.outputs.file }}
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 14
      - name: Link the test installer in the run summary
        shell: pwsh
        env:
          FILE: ${{ steps.test-installer.outputs.file }}
          URL: ${{ steps.upload-test-installer.outputs.artifact-url }}
        run: |
          @(
            '### Test installer'
            ''
            "[$env:FILE]($env:URL) (sign in to GitHub to download it)"
            ''
            'It holds the code of this run, which nobody may have reviewed yet, and it is not'
            'signed. Setup runs as administrator: install it only if you trust this code.'
          ) >> $env:GITHUB_STEP_SUMMARY

  corpus:
    name: Corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The projects and commits are pinned in xtask/public-corpus.txt.
      - name: Fetch the public corpus
        run: cargo xtask corpus fetch
      - name: Test idempotence, comment preservation and canonicalization
        run: >-
          cargo test -p tctidy --locked
          --test corpus_invariants --test corpus_comments --test canonicalization
          -- --nocapture

  ci:
    name: CI
    if: always()
    needs: [linux, windows, corpus]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        run: |
          [[ '${{ needs.linux.result }}' == success ]]
          [[ '${{ needs.windows.result }}' == success ]]
          [[ '${{ needs.corpus.result }}' == success ]]
